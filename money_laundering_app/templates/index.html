<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Transactions | ADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        /* Subtle grid overlay */
        body::before {
            content: "";
            position: absolute;
            width: 150%;
            height: 150%;
            background:
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
            top: -25%;
            left: -25%;
            z-index: 0;
        }

        /* Giant glowing spider web filling entire screen */
        .web {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 90vh; /* fills top to bottom of viewport */
            color: #00ff88;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 50px #00ff88);
            animation: glowPulse 6s ease-in-out infinite;
            line-height: 1;
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.15;
                filter: drop-shadow(0 0 60px #00ff88);
            }
            50% {
                opacity: 0.3;
                filter: drop-shadow(0 0 120px #00ffaa);
            }
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            padding: 40px;
            background: #0a0a0a;
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        h2 {
            font-weight: 700;
            color: #00bfff;
        }

        .btn-primary {
            background-color: #00bfff;
            border: none;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(0,191,255,0.5);
        }

        .btn-primary:hover {
            background-color: #1ec0ff;
            box-shadow: 0 0 20px rgba(0,191,255,0.8);
            transform: scale(1.02);
            transition: all 0.2s ease-in-out;
        }

        input[type="file"] {
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,191,255,0.5);
        }
    </style>
</head>
<body>

    <!-- Huge glowing web filling the screen -->
    <div class="web">🕸️</div>

    <div class="card text-center">
        <h2 class="mb-4">📤 Upload Transactions (CSV)</h2>
        <form action="/dashboard" method="post" enctype="multipart/form-data">
            <input type="file" name="file" class="form-control mb-3" required>
            <button type="submit" class="btn btn-primary w-100 py-2">Analyze Transactions</button>
        </form>
    </div>

</body>
</html>
